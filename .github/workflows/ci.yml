name: ci

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: fmt + clippy + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache
        uses: Swatinem/rust-cache@v2

      - name: cargo fmt
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: cargo test
        run: cargo test --locked

      - name: cargo build --release
        run: cargo build --release --locked

      - name: smoke test
        run: |
          ./target/release/ytm --version
          ./target/release/ytt --version
          ./target/release/ytm --help > /dev/null
          ./target/release/ytt --help > /dev/null

  pkgbuild:
    name: PKGBUILD + .SRCINFO
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
    steps:
      - run: pacman -Syu --noconfirm --needed base-devel git
      - uses: actions/checkout@v4

      - name: синтаксис PKGBUILD
        run: |
          bash -n packaging/aur/ytm-tui/PKGBUILD
          bash -n packaging/aur/ytm-tui-bin/PKGBUILD

      - name: .SRCINFO в актуальном состоянии
        run: |
          useradd -m builder
          cp -r packaging/aur /tmp/aur
          chown -R builder /tmp/aur
          for p in ytm-tui ytm-tui-bin; do
            su builder -c "cd /tmp/aur/$p && makepkg --printsrcinfo" > /tmp/$p.generated
            diff -u <(sort /tmp/aur/$p/.SRCINFO) <(sort /tmp/$p.generated)
          done
        shell: bash
